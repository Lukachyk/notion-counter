
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: transparent;
  text-align: center;
}

p {
  margin: 0 0 8px;
  font-size: 16px;
  color: #222222;
}

body.dark p {
  color: #ffffff;
}

img {
  display: block;
  margin: auto;
  max-width: 100%;
}
</style>
</head>

<body>
<p>👁 Перегляди каталогу</p>

<img
  src="https://hits.sh/spiced-jellyfish-933.notion.site/420e6128f182800989ccf39b7172a5fc.svg"
  alt="Перегляди каталогу"
>

<script>
const theme = window.matchMedia('(prefers-color-scheme: dark)');

function updateTheme() {
  document.body.classList.toggle('dark', theme.matches);
}

updateTheme();
theme.addEventListener('change', updateTheme);
</script>

</body>
</html>
